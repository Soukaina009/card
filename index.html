<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Soukaina Zemzam – Carte de visite</title>
<meta name="description" content="Master 2 IA et Économie Numérique – à la recherche d’un stage PFE.">
<meta property="og:title" content="Soukaina Zemzam – Carte de visite">
<meta property="og:description" content="Master 2 IA et Économie Numérique – à la recherche d’un stage PFE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:only light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ede1f8;--ink:#4a3868;--muted:#6f5f8b;--line:#d6c2eb}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#ede1f8}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;min-height:100vh}
main{max-width:420px;margin:0 auto;padding:24px 16px 48px}
.scene{perspective:1400px;width:100%;container-type:inline-size}
.card{position:relative;width:100%;aspect-ratio:4/5.6;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:7cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:7cqw;display:flex;flex-direction:column;box-shadow:0 18px 40px -20px rgba(74,56,104,.45);color:#4a3868;overflow:hidden}
.front{background:#fef3ff;justify-content:space-between}
.back{background:#d6c2eb;transform:rotateY(180deg);pointer-events:none;align-items:center;text-align:center}
.card.flipped .front{pointer-events:none}
.card.flipped .back{pointer-events:auto}
.head{display:flex;gap:5cqw;align-items:flex-end}
.photo{width:30cqw;aspect-ratio:4/5;border-radius:999px 999px 6cqw 6cqw;background:#d6c2eb;overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:"Newsreader",Georgia,serif;font-size:9cqw;flex:none}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.id{min-width:0}
h1{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:max(22px,7cqw);line-height:1.05;margin:0 0 2cqw;overflow-wrap:anywhere}
.role{margin:0 0 3cqw;font-size:max(13px,3.6cqw);line-height:1.35;color:#6f5f8b}
.goal{display:inline-block;background:#f3cde2;color:#4a3868;border-radius:999px;padding:1cqw 3cqw;font-size:max(11px,3cqw);font-weight:500}
.cv{display:flex;align-items:center;gap:4.5cqw;background:#ede1f8;border-radius:5cqw;padding:3.4cqw;color:#4a3868;text-decoration:none}
.cvqr{width:28cqw;aspect-ratio:1;background:#fef3ff;border-radius:3cqw;padding:2cqw;display:flex;flex:none}
.cvqr img,.cvqr canvas,.qrtile img,.qrtile canvas{width:100%!important;height:100%!important;display:block}
.cvtxt b{display:block;font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:max(18px,5.6cqw);line-height:1.1}
.cvtxt small{display:block;margin-top:1.2cqw;font-size:max(12px,3.3cqw);line-height:1.35;color:#6f5f8b}
.rows{border-top:1px solid #d6c2eb;padding-top:4cqw;display:grid;gap:2.4cqw}
.row{display:grid;grid-template-columns:17cqw 1fr;gap:2cqw;font-size:max(13px,3.6cqw);align-items:baseline;min-width:0}
.row span{color:#6f5f8b;font-size:max(11px,3cqw)}
.row a{color:#4a3868;text-decoration:none;overflow-wrap:anywhere;font-weight:500}
.row a:hover{text-decoration:underline}
.back .qrtile{margin:auto 0 0;background:#fef3ff;border-radius:6cqw;padding:5cqw;width:68cqw;aspect-ratio:1;display:flex}
.back .cap{margin:5cqw 0 0;font-family:"Newsreader",Georgia,serif;font-size:max(20px,6cqw);line-height:1.15}
.back .sub{margin:1.4cqw 0 0;font-size:max(12px,3.4cqw)}
.back .who{margin:auto 0 0;font-size:max(12px,3.2cqw);font-weight:500}
.bar{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
button.btn{font:inherit;font-weight:500;font-size:.92rem;padding:11px 18px;border-radius:999px;border:1px solid #d6c2eb;background:#fef3ff;color:#4a3868;cursor:pointer}
button.btn.main{background:#4a3868;border-color:#4a3868;color:#fef3ff}
button:focus-visible,a:focus-visible{outline:3px solid #8f6cc2;outline-offset:2px}
.msg{text-align:center;color:var(--muted);font-size:.85rem;min-height:1.3em;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
 <div class="scene">
  <div class="card" id="card">
   <section class="face front" aria-label="Recto de la carte">
    <div class="head">
     <div class="photo" id="photo"></div>
     <div class="id">
      <h1 id="f-name"></h1>
      <p class="role" id="f-master"></p>
      <span class="goal" id="f-goal"></span>
     </div>
    </div>
    <a class="cv" id="cv" target="_blank" rel="noopener">
     <span class="cvqr" id="cvqr"></span>
     <span class="cvtxt"><b>Mon CV</b><small>Scanne le QR code ou touche ici pour l’ouvrir</small></span>
    </a>
    <div class="rows" id="rows"></div>
   </section>
   <section class="face back" aria-label="Verso de la carte">
    <div class="qrtile" id="qr"></div>
    <p class="cap">Retrouve ma carte</p>
    <p class="sub">Contact, CV et liens, au même endroit</p>
    <p class="who" id="b-name"></p>
   </section>
  </div>
 </div>
 <div class="bar">
  <button class="btn main" id="save">Enregistrer le contact</button>
  <button class="btn" id="flip">Retourner la carte</button>
  <button class="btn" id="share">Partager</button>
 </div>
 <p class="msg" id="msg" role="status"></p>
</main>

  carte:''
};
(function(){
  var $=function(i){return document.getElementById(i)};
  var full=(C.prenom+' '+C.nom).trim();
  function say(t){$('msg').textContent=t;setTimeout(function(){if($('msg').textContent===t)$('msg').textContent=''},2500)}
  var cardUrl=C.carte||location.href.split(/[?#]/)[0].replace(/index\.html$/,'');

  var ph=$('photo');
  function initials(){ph.textContent=((C.prenom[0]||'')+(C.nom[0]||'')).toUpperCase()}
  initials();
  if(C.photo){var im=new Image();im.alt='Photo de '+full;im.onload=function(){ph.innerHTML='';ph.appendChild(im)};im.src=C.photo}

  $('f-name').textContent=full;$('b-name').textContent=full;
  $('f-master').textContent=C.master;
  if(C.objectif)$('f-goal').textContent=C.objectif;else $('f-goal').style.display='none';
  $('cv').href=C.cv;

  var rows=$('rows');
  [['Email',C.email,'mailto:'+C.email,C.email],['Tél.',C.tel,'tel:'+(C.tel||'').replace(/\s/g,''),C.tel],['LinkedIn',C.linkedin,C.linkedin,C.linkedinLabel],['GitHub',C.github,C.github,C.githubLabel]].forEach(function(r){
    if(!r[1])return;
    var d=document.createElement('div');d.className='row';
    var s=document.createElement('span');s.textContent=r[0];
    var a=document.createElement('a');a.href=r[2];a.textContent=r[3];
    if(r[0]==='LinkedIn'||r[0]==='GitHub'){a.target='_blank';a.rel='noopener'}
    d.appendChild(s);d.appendChild(a);rows.appendChild(d);
  });

  function qr(el,text){try{new QRCode(el,{text:text,width:300,height:300,colorDark:'#3b2a57',colorLight:'#fef3ff',correctLevel:QRCode.CorrectLevel.M})}catch(e){}}
  qr($('cvqr'),C.cv);
  qr($('qr'),cardUrl);

  var card=$('card');
  function flip(){card.classList.toggle('flipped');$('flip').textContent=card.classList.contains('flipped')?'Revenir au recto':'Retourner la carte'}
  $('flip').addEventListener('click',flip);
  card.addEventListener('click',function(e){if(e.target.closest('a,button'))return;flip()});

  $('save').addEventListener('click',function(){
    var e=function(s){return String(s).replace(/([,;\\])/g,'\\$1')};
    var v=['BEGIN:VCARD','VERSION:3.0','N:'+e(C.nom)+';'+e(C.prenom)+';;;','FN:'+e(full)];
    if(C.master)v.push('TITLE:'+e(C.master));
    if(C.tel)v.push('TEL;TYPE=CELL:'+e(C.tel));
    if(C.email)v.push('EMAIL:'+e(C.email));
    [C.cv,C.linkedin,C.github].forEach(function(u){if(u)v.push('URL:'+u)});
    v.push('END:VCARD');
    var a=document.createElement('a');
    a.href='data:text/vcard;charset=utf-8,'+encodeURIComponent(v.join('\r\n'));
    a.download=(C.prenom+'-'+C.nom).toLowerCase()+'.vcf';
    document.body.appendChild(a);a.click();a.remove();
    say('Fiche contact téléchargée');
  });

  $('share').addEventListener('click',function(){
    if(navigator.share){navigator.share({title:full,url:cardUrl}).catch(function(){})}
    else{try{navigator.clipboard.writeText(cardUrl).then(function(){say('Lien copié')},function(){say(cardUrl)})}catch(e){say(cardUrl)}}
  });
})();
</script>
